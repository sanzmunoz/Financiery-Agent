<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinBot - Asistente Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Custom coin cursor — shown outside the chat box -->
<div id="coin-cursor">🪙</div>

<div class="container">

    <header class="header">
        <h1>Hola soy FinBot</h1>
        <p>Tu asistente financiero con IA. Consulta tasas en tiempo real, analiza documentos bancarios y resuelve tus dudas en español e inglés — Disponible 24/7.</p>
    </header>

    <div class="chat-container">
        <div id="messages" class="messages"></div>

        <div id="loading" class="loading hidden">
            <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <p>FinBot está escribiendo...</p>
        </div>
    </div>

    <form id="chat-form" class="input-form">

        <div class="selectors-row">
            <div class="selector-group">
                <span class="selector-label">Entrada</span>
                <div class="mode-selector">
                    <button type="button" class="input-mode-btn active" data-input-mode="text">
                        De Texto
                    </button>
                    <button type="button" class="input-mode-btn" data-input-mode="voice">
                        De Voz
                    </button>
                    <button type="button" class="input-mode-btn" data-input-mode="image">
                        De Imagen+Texto
                    </button>
                </div>
            </div>

            <div class="selector-group">
                <span class="selector-label">Respuesta</span>
                <div class="mode-selector">
                    <button type="button" class="response-mode-btn active" data-response-mode="text">
                        En Texto
                    </button>
                    <button type="button" class="response-mode-btn" data-response-mode="audio">
                        En Audio
                    </button>
                </div>
            </div>
        </div>

        <div class="voice-recorder hidden" id="voice-section">
            <button type="button" id="record-btn" class="record-btn">
                ¿Que le quieres decir al agente?
            </button>
            <div id="recording-status" class="recording-status hidden">
                <span class="recording-dot"></span>
                <span>Grabando...</span>
            </div>
        </div>

        <div class="image-upload-container hidden" id="image-section">
            <input type="file" id="image-upload" accept="image/*" class="image-input">
            <label for="image-upload" class="image-label">Adjuntar imagen</label>
            <div id="image-preview" class="image-preview hidden"></div>
        </div>

        <div class="audio-upload-container hidden" id="audio-section-upload">
            <input type="file" id="audio-upload" accept=".mp3,.wav,.ogg,.webm,.m4a,.mp4,.mp4a,.mpeg,.mpga" class="audio-file-input">
            <label for="audio-upload" class="audio-file-label">Subir audio aquí</label>
            <div id="audio-file-preview" class="audio-file-preview hidden"></div>
        </div>

        <div class="input-container">
            <input type="text" id="message-input" placeholder="Escribe tu mensaje..." autocomplete="off">
            <button type="submit" id="send-btn" class="send-btn">Enviar</button>
        </div>
    </form>

</div>

<script src="app.js"></script>
</body>
</html>
