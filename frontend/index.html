<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinBot - Asistente Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <!--HEADER-->
    <header class="header">
        <h1>💰 FinBot</h1>
        <p>Tu asistente financiero inteligente</p>
    </header>

    <!-- CONTENEDOR DEL CHAT (aquí se acumula el historial)-->
    <div class="chat-container">

        <!-- Contenedor de mensajes - AQUÍ SE ACUMULA EL HISTORIAL -->
        <div id="messages" class="messages">
            <!-- Los mensajes se van agregando aquí dinámicamente -->
            <!-- NO se borran, se acumulan para formar el historial -->
        </div>

        <!-- Indicador de carga -->
        <div id="loading" class="loading hidden">
            <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <p>FinBot está escribiendo...</p>
        </div>
    </div>

    <!-- FORMULARIO DE INPUT (siempre visible abajo) -->
    <form id="chat-form" class="input-form">

        <!-- Fila de selectores -->
        <div class="selectors-row">
            <!-- Selector modo de ENTRADA: Texto / Voz / Imagen+Texto -->
            <div class="selector-group">
                <span class="selector-label">Entrada</span>
                <div class="mode-selector">
                    <button type="button" class="input-mode-btn active" data-input-mode="text">
                        📝 Texto
                    </button>
                    <button type="button" class="input-mode-btn" data-input-mode="voice">
                        🎙️ Voz
                    </button>
                    <button type="button" class="input-mode-btn" data-input-mode="image">
                        🖼️ Imagen+Texto
                    </button>
                </div>
            </div>

            <!-- Selector modo de RESPUESTA: Texto / Audio -->
            <div class="selector-group">
                <span class="selector-label">Respuesta</span>
                <div class="mode-selector">
                    <button type="button" class="response-mode-btn active" data-response-mode="text">
                        💬 Texto
                    </button>
                    <button type="button" class="response-mode-btn" data-response-mode="audio">
                        🔊 Audio
                    </button>
                </div>
            </div>
        </div>

        <!-- Sección de grabación de voz (visible solo en modo Voz) -->
        <div class="voice-recorder hidden" id="voice-section">
            <button type="button" id="record-btn" class="record-btn">
                🎤 Grabar voz
            </button>
            <div id="recording-status" class="recording-status hidden">
                <span class="recording-dot"></span>
                <span>Grabando...</span>
            </div>
        </div>

        <!-- Sección de upload de imagen (visible solo en modo Imagen+Texto) -->
        <div class="image-upload-container hidden" id="image-section">
            <input
                    type="file"
                    id="image-upload"
                    accept="image/*"
                    class="image-input"
            >
            <label for="image-upload" class="image-label">
                📎 Adjuntar imagen
            </label>
            <div id="image-preview" class="image-preview hidden"></div>
        </div>

        <!-- Upload de archivo de audio -->
        <div class="audio-upload-container hidden" id="audio-section-upload">
          <input
            type="file"
            id="audio-upload"
            accept=".mp3,.wav,.ogg,.webm,.m4a,.mp4,.mp4a,.mpeg,.mpga"
            class="audio-file-input"
          >
          <label for="audio-upload" class="audio-file-label">
            📁 Subir audio
          </label>
          <div id="audio-file-preview" class="audio-file-preview hidden"></div>
        </div>

        <!-- Input de texto + botón enviar -->
        <div class="input-container">
            <input
                    type="text"
                    id="message-input"
                    placeholder="Escribe tu mensaje..."
                    autocomplete="off"
            >
            <button type="submit" id="send-btn" class="send-btn">
                Enviar
            </button>
        </div>
    </form>

</div>

<script src="app.js"></script>
</body>
</html>
